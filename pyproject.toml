[project]
name = "classy"
dynamic=["version"]
description="Python interface to the Cosmological Boltzmann code CLASS"
authors = [
  {name = "Julien Lesgourgues"},
  {name = "Thomas Tram"},
  {name = "Nils Schöneberg"},
  {name = "... and many more (see webpage)"}
]

[project.urls]
Homepage = "http://www.class-code.net"
# Documentation = https://readthdocs.org/classy # TBD

# What python/test_class.py needs besides classy; the CI installs it with
# pip install --group pyproject.toml:test (pip >= 25.1).
[dependency-groups]
test = ["numpy", "scipy", "matplotlib", "pynose", "parameterized"]

[build-system]
requires = ['setuptools','wheel','numpy','cython']
build-backend = "setuptools.build_meta"

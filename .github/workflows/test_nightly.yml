name: Nosetests and Valgrind

# To run this workflow on other branches than devel, uncomment line 4 and comment line 5-7.
#on: [push]
on:
  schedule:
    - cron: '0 20 * * *'  # Daily at UTC 20:00

# iftest reads the list of earlier runs of this workflow.
permissions:
  contents: read
  actions: read

jobs:
  # The tests run only if the commit differs from the one of the last successful run.
  iftest:
    runs-on: [self-hosted]
    outputs:
      should_run: ${{ steps.compare.outputs.should_run }}
    steps:
    - name: Compare with the commit of the last successful run
      id: compare
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        last=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/test_nightly.yml/runs?status=success&branch=$GITHUB_REF_NAME&per_page=1" \
          | python3 -c 'import json, sys; runs = json.load(sys.stdin)["workflow_runs"]; print(runs[0]["head_sha"] if runs else "")')
        echo "Last successful run: ${last:-none}. This run: $GITHUB_SHA."
        if [ "$last" = "$GITHUB_SHA" ]; then
          echo "should_run=0" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=1" >> "$GITHUB_OUTPUT"
        fi

  nose_tests_lvl3:
    runs-on: [self-hosted]
    needs: iftest
    if: needs.iftest.outputs.should_run > 0
    steps:
    - name: Checkout 🛎
      uses: actions/checkout@v7
      with:
        path: main_class
    # The venv lives in RUNNER_TEMP, which the runner empties after every job,
    # so no package survives from an earlier run.
    - name: Create virtual Python environment
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/python" -m pip install --group main_class/pyproject.toml:test
    - name: make
      run: cd main_class && make -j
    - name: Testing 🤖
      run: |
        cd main_class/python
        OMP_NUM_THREADS=32 COMPARE_OUTPUT_GAUGE=1 TEST_LEVEL=3 nosetests -v -a test_scenario test_class.py --nologcapture --nocapture
    - name: Upload plots 📤
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ComparePlots
        path: main_class/python/faulty_figs
        if-no-files-found: ignore

  valgrind-wide-and-shallow:
    runs-on: [self-hosted]
    needs: iftest
    if: needs.iftest.outputs.should_run > 0
    timeout-minutes: 1440
    steps:
    - name: Checkout 🛎
      uses: actions/checkout@v7
      with:
        path: main_class
    # The venv lives in RUNNER_TEMP, which the runner empties after every job,
    # so no package survives from an earlier run.
    - name: Create virtual Python environment
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/python" -m pip install --group main_class/pyproject.toml:test
    - name: make
      run: cd main_class && make -j
    - name: Generate input files
      run: |
        cd main_class/python
        TEST_LEVEL=3 VALGRIND_MODE=1 CLASS_VERBOSE=1 nosetests -a dump_ini_files test_class.py
    - name: Valgrind 🤖
      run: |
        cd main_class/python/faulty_figs
        rm -rf output && mkdir output
        rm -rf valgrind_output && mkdir valgrind_output
        cp ../../class .
        find . -name "*.ini" -type f -print0 | xargs -0 -I {} -n 1 -P 32 bash -c ': \
          && printf "\nk_step_sub = 10.0\nk_step_super = 0.4\nk_per_decade_for_pk = 2\nk_per_decade_for_bao = 5\n" >> {}'
        find . -name "*.ini" -type f -print0 | xargs -0 -I {} -n 1 -P 32 bash -c ': \
          && (OMP_NUM_THREADS=1 valgrind --track-origins=yes --show-leak-kinds=all --leak-check=full --error-exitcode=3 ./class {} &> {}.out && echo {} "...ok") \
          || (echo {} "...fail" && cp {}* valgrind_output && exit 3)'
    - name: Upload errors 📤
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ValgrindOutputWideShallow
        path: main_class/python/faulty_figs/valgrind_output
        if-no-files-found: ignore

  valgrind-narrow-and-deep:
    runs-on: [self-hosted]
    needs: iftest
    if: needs.iftest.outputs.should_run > 0
    timeout-minutes: 1440
    steps:
    - name: Checkout 🛎
      uses: actions/checkout@v7
      with:
        path: main_class
    # The venv lives in RUNNER_TEMP, which the runner empties after every job,
    # so no package survives from an earlier run.
    - name: Create virtual Python environment
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/python" -m pip install --group main_class/pyproject.toml:test
    - name: make
      run: cd main_class && make -j
    - name: Generate input files
      run: |
        cd main_class/python
        TEST_LEVEL=1 CLASS_VERBOSE=1 nosetests -a dump_ini_files test_class.py
    - name: Valgrind 🤖
      run: |
        cd main_class/python/faulty_figs
        rm -rf output && mkdir output
        rm -rf valgrind_output && mkdir valgrind_output
        cp ../../class .
        find . -name "*.ini" -type f -print0 | xargs -0 -I {} -n 1 -P 32 bash -c ': \
          && (OMP_NUM_THREADS=1 valgrind --track-origins=yes --show-leak-kinds=all --leak-check=full --error-exitcode=3 ./class {} &> {}.out && echo {} "...ok") \
          || (echo {} "...fail" && cp {}* valgrind_output && exit 3)'
    - name: Upload errors 📤
      if: success() || failure()
      uses: actions/upload-artifact@v7
      with:
        name: ValgrindOutputNarrowDeep
        path: main_class/python/faulty_figs/valgrind_output
        if-no-files-found: ignore

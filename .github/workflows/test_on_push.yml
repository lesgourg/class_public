name: Build and light test

on: [push]

permissions:
  contents: read

# A new push cancels the run on the commit it replaces, except on devel and master.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/devel' && github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: [self-hosted]

    steps:
    - name: Checkout 🛎
      uses: actions/checkout@v7
      with:
        path: main_class
    - name: make
      run: cd main_class && make -j class
    - name: run class
      run: cd main_class && ./class explanatory.ini

  nose_tests_lvl1:
    runs-on: [self-hosted]

    steps:
    - name: Checkout 🛎
      uses: actions/checkout@v7
      with:
        path: main_class
    # The venv lives in RUNNER_TEMP, which the runner empties after every job,
    # so no package survives from an earlier run.
    - name: Create virtual Python environment
      run: |
        python3 -m venv "$RUNNER_TEMP/venv"
        echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/venv/bin/python" -m pip install --group main_class/pyproject.toml:test
    - name: make classy
      run: cd main_class && make -j
    - name: Testing 🤖
      run: |
        cd main_class/python
        OMP_NUM_THREADS=16 TEST_LEVEL=1 nosetests -v -a test_scenario test_class.py --nologcapture --nocapture
